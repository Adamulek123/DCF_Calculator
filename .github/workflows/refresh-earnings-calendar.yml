name: Refresh earnings calendar

on:
  pull_request:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnings-calendar-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install reviewed dependency lock
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify installed dependency metadata
        run: python -m pip check
      - name: Check Python bytecode compilation
        run: python -m compileall -q 123.py earnings_calendar.py earnings_market_caps.py scripts tests
      - name: Run all backend unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  refresh:
    if: github.event_name != 'pull_request' && vars.EARNINGS_REFRESH_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install reviewed dependency lock
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify installed dependency metadata
        run: python -m pip check
      - name: Refresh calendar
        id: refresh
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          EARNINGS_FUTURE_COVERAGE_DAYS: "30"
          EARNINGS_PROVIDER_SUPPORTED_FUTURE_DAYS: "30"
          EARNINGS_PROVIDER_REQUESTS_PER_MINUTE: "45"
          EARNINGS_PROFILE_MAX_PER_RUN: "25"
          EARNINGS_EXECUTION_MAX_SECONDS: "720"
        run: python scripts/run_earnings_calendar_refresh.py
      - name: Verify production publication
        if: steps.refresh.outputs.provider_checked == 'true'
        env:
          EARNINGS_EXPECTED_CHECKED_AT: ${{ steps.refresh.outputs.checked_at }}
          EARNINGS_EXPECTED_REFRESH_SEQUENCE: ${{ steps.refresh.outputs.refresh_sequence }}
        run: python scripts/verify_earnings_publication.py
