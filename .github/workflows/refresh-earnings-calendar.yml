name: Refresh earnings calendar

on:
  pull_request:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnings-calendar-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test earnings ingestion
        run: python -m unittest tests.test_earnings_market_caps tests.test_earnings_calendar

  refresh:
    if: github.event_name != 'pull_request' && vars.EARNINGS_REFRESH_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh calendar
        id: refresh
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          EARNINGS_FUTURE_COVERAGE_DAYS: "30"
          EARNINGS_PROVIDER_SUPPORTED_FUTURE_DAYS: "30"
          EARNINGS_PROVIDER_REQUESTS_PER_MINUTE: "45"
          EARNINGS_PROFILE_MAX_PER_RUN: "25"
          EARNINGS_EXECUTION_MAX_SECONDS: "720"
          EARNINGS_PROVIDER_PERMISSION_CONFIRMED: ${{ vars.EARNINGS_PROVIDER_PERMISSION_CONFIRMED }}
          EARNINGS_PROVIDER_PERMISSION_DATE: ${{ vars.EARNINGS_PROVIDER_PERMISSION_DATE }}
          EARNINGS_PROVIDER_ACCOUNT_PLAN: ${{ vars.EARNINGS_PROVIDER_ACCOUNT_PLAN }}
          EARNINGS_PROVIDER_PERMISSION_EVIDENCE_REF: ${{ vars.EARNINGS_PROVIDER_PERMISSION_EVIDENCE_REF }}
        run: python scripts/run_earnings_calendar_refresh.py
      - name: Verify publication and notify external heartbeat
        if: steps.refresh.outputs.provider_checked == 'true'
        env:
          EARNINGS_HEARTBEAT_URL: ${{ secrets.EARNINGS_HEARTBEAT_URL }}
          EARNINGS_EXPECTED_CHECKED_AT: ${{ steps.refresh.outputs.checked_at }}
          EARNINGS_EXPECTED_REFRESH_SEQUENCE: ${{ steps.refresh.outputs.refresh_sequence }}
        run: python scripts/notify_earnings_heartbeat.py
